<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested List</title>
    <style>
        body{
            font-family: sans-serif;
            font-size: 24px;
            margin-left: 50px;
        }
    </style>
</head>
<body>
    <p><u>Nested List</u> : A list within another list is called Nested list</p>
    Example:
    <ol>
        <li>HTML Tags
            <ul>
                <li>Content tags</li>
                <li>Non content tags</li>
            </ul>
        </li><br>
        <li>HTML list
            <ul>
                <li>Orederd list</li>
                <li>Unordered list</li>
                <li>Discription list</li>
            </ul>

        </li><br>
        <li>HTML Links
            <ul>
                <li>Absolute</li>
                <li>Relative</li>
            </ul>
        </li>
       
    </ol>

</body>
</html>
