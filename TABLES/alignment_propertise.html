<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table element properties</title>
    <style>
        body{
            font-family: sans-serif;
            font-size: 25px;
            
        }
        table{
            border-collapse: collapse;
            height: 350px;
            width: 690px;
            margin-top: 20px;
        }
    </style>
    
</head>
<body>
    <p>Some alignment properties</p>
    <ol>
        <li>Align
            <ul>
                <li>center</li>
                <li>left</li>
                <li>right</li>
            </ul>
        </li>
        <li>Valign
            <ul>
                <li>Top</li>
                <li>Bottom</li>
            </ul>
        </li>
    </ol>
    <div>Example for table alignment properties: </div>
    <table border="2">
        <tr>
            <th>ALIGN</th>
            <td align="left">SIDDU</td>
            <td align="center">SIDDU</td>
            <td align="right">SIDDU</td>
        </tr>
        <tr>
            <th>VALIGN</th>
            <td valign="top">SIDDU</td>
            <td valign="bottom">SIDDU</td>
        </tr>
    
    </table>
</body>
</html>
